name: clubbar_admin
description: "Venda de ingressos e produtos para bares e casas noturnas."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  mime: ^2.0.0
  http_parser: ^4.0.2
  intl: ^0.20.2
  fl_chart: ^0.68.0
  mobile_scanner: ^5.2.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true

  ios: true

  image_path: "assets/images/coruja.jpg"

  adaptive_icon_background: "#000000"

  adaptive_icon_foreground:
    "assets/images/coruja.jpg"


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  